spring.application.name=ZcApi
server.port=9010


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zc_mahjong}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
# PostgreSQL JDBC 驱动
spring.datasource.driver-class-name=org.postgresql.Driver
# 每次启动均执行 schema.sql；其中 SQL 使用 IF NOT EXISTS，支持重复执行
spring.sql.init.mode=always

# JSON 序列化时不输出值为 null 的字段
spring.jackson.default-property-inclusion=non_null


# 单个上传文件的最大大小，当前用于限制头像上传
spring.servlet.multipart.max-file-size=5MB
# 单次 multipart 请求的最大大小
spring.servlet.multipart.max-request-size=5MB

# 头像文件保存目录，可通过环境变量 UPLOAD_DIR 覆盖，默认使用程序工作目录下的 uploads
app.upload-dir=${UPLOAD_DIR:uploads}
# 自有登录 Token 的有效天数，可通过环境变量 TOKEN_VALID_DAYS 覆盖，默认 30 天
app.auth.token-valid-days=${TOKEN_VALID_DAYS:30}


# 微信小程序 AppID，必须与小程序端 manifest.json 中配置的 AppID 一致
wechat.app-id=${WECHAT_APP_ID:}
# 微信小程序 AppSecret，仅允许在后端通过环境变量配置，禁止提交真实密钥
wechat.app-secret=${WECHAT_APP_SECRET:}
# 小程序码打开的版本：develop、trial 或 release；开发阶段默认 develop
wechat.mini-program.env-version=${WECHAT_MINIPROGRAM_ENV_VERSION:trial}
